name: SDK CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q roku_ai examples/common_ground tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test SDK CLI
        run: |
          python -m roku_ai init example.json
          python -m roku_ai build example.json --out dist/example
          python -m roku_ai package dist/example --out dist/example.zip
      - name: Build CommonGround
        run: |
          python examples/common_ground/build.py examples/common_ground/feeds.json dist/common-ground
          python -m roku_ai package dist/common-ground --out dist/common-ground.zip
      - name: Validate ZIP contents and generated SceneGraph
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import zipfile
          for name in ("example", "common-ground"):
              path = Path("dist") / (name + ".zip")
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  names = set(archive.namelist())
                  assert {"manifest", "source/main.brs", "components/MainScene.xml"} <= names
                  ET.fromstring(archive.read("components/MainScene.xml"))
                  if name == "common-ground":
                      assert "components/MainScene.brs" in names
                      assert b"onKeyEvent" in archive.read("components/MainScene.brs")
