name: Build and release CommonGround

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release with a Roku ZIP (requires passing tests)"
        type: boolean
        default: false
      server_url:
        description: "Public HTTPS server origin for the Roku channel"
        type: string
        default: ""
      tag:
        description: "Release tag, e.g. v0.3.0"
        type: string
        default: v0.3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r examples/common_ground/requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build Roku app
        env:
          COMMON_GROUND_BASE_URL: ${{ inputs.server_url || 'https://example.invalid' }}
        run: |
          python examples/common_ground/build_live.py examples/common_ground/feeds.json dist/common-ground-live
          python -m roku_ai package dist/common-ground-live --out dist/CommonGround-Roku.zip
      - name: Validate package
        shell: python
        run: |
          import zipfile
          with zipfile.ZipFile("dist/CommonGround-Roku.zip") as z:
              assert z.testzip() is None
              assert {"manifest", "source/main.brs", "components/MainScene.xml", "components/FeedTask.brs", "components/FeedTask.xml"} <= set(z.namelist())
      - name: Upload Roku ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CommonGround-Roku
          path: dist/CommonGround-Roku.zip
          if-no-files-found: error
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.server_url }}" =~ ^https://[^[:space:]]+$ ]]; then
            echo "A public HTTPS server_url is required to publish" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/CommonGround-Roku.zip \
            --target "$GITHUB_SHA" \
            --title "CommonGround $RELEASE_TAG" \
            --notes "Developer-preview Roku sideload package. IMPORTANT: The release requires a separately deployed CommonGround server at ${{ inputs.server_url }}. Not a Roku-certified consumer release."
